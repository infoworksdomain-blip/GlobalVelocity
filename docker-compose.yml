services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: velocity, POSTGRES_PASSWORD: velocity, POSTGRES_DB: velocity }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/velocity-media; mc anonymous set download local/velocity-media; exit 0"
  app:
    build: .
    command: sh -c "npm run db:migrate && npm run db:seed && npm run start"
    env_file: .env
    environment: { DATABASE_URL: postgres://velocity:velocity@db:5432/velocity, REDIS_URL: redis://redis:6379, S3_ENDPOINT: http://minio:9000 }
    ports: ["3000:3000"]
    depends_on: [db, redis, minio]
  worker:
    build: .
    command: npm run worker
    env_file: .env
    environment: { DATABASE_URL: postgres://velocity:velocity@db:5432/velocity, REDIS_URL: redis://redis:6379, S3_ENDPOINT: http://minio:9000 }
    depends_on: [db, redis, minio]
volumes: { dbdata: {}, miniodata: {} }
