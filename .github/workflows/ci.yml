name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db: { image: pgvector/pgvector:pg16, env: { POSTGRES_USER: velocity, POSTGRES_PASSWORD: velocity, POSTGRES_DB: velocity }, ports: ["5432:5432"], options: --health-cmd "pg_isready -U velocity" --health-interval 5s --health-retries 10 }
      redis: { image: redis:7-alpine, ports: ["6379:6379"] }
    env:
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000/api/auth
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DATABASE_URL: postgres://velocity:velocity@localhost:5432/velocity
      REDIS_URL: redis://localhost:6379
      PROVIDER_MODE: mock
      STORAGE_DRIVER: local
      METRICS_FIRST_PULL_DELAY_MS: "5000"
      ALLOW_HTTP_WEBHOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate && npm run db:seed
      - run: (npm run start &) && (npm run worker &) && sleep 8 && curl -sf localhost:3000/api/health
      - run: npm run test:e2e
      - run: npx playwright install --with-deps chromium && npm run test:browser
        continue-on-error: true
