<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velocity — interactive design prototype</title>
<style>
:root{
  --brand50:#eef2ff;--brand100:#dfe6ff;--brand200:#c3d0ff;--brand400:#6b8bff;--brand500:#3d5cf5;--brand600:#2947d6;--brand700:#1f38ad;--brand900:#0b1a4b;
  --accent400:#34d399;--accent500:#10b981;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f6f8fb;
  --soft:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.18);
  --lift:0 12px 40px -16px rgba(41,71,214,.35);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em}
p{margin:0}
code{font-family:var(--mono);font-size:12.5px}
::selection{background:var(--brand100)}

/* ---------- prototype chrome ---------- */
#chrome{position:fixed;inset:0 0 auto 0;height:52px;z-index:100;background:#0b1a4b;color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
#chrome .logo{display:flex;align-items:center;gap:8px;font-weight:800}
#chrome .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#3d5cf5,#1f38ad);display:grid;place-items:center}
#chrome .tag{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px;font-size:12px}
#chrome .seg{margin-left:auto;display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;gap:2px}
#chrome .seg button{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:#dbe3ff}
#chrome .seg button.on{background:#fff;color:var(--brand700)}
#pagebar{position:fixed;top:52px;left:0;right:0;height:42px;z-index:99;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 14px;overflow-x:auto;white-space:nowrap}
#pagebar button{padding:5px 10px;border-radius:8px;font-size:12.5px;color:#475569;font-weight:500}
#pagebar button:hover{background:#f1f5f9}
#pagebar button.on{background:var(--brand50);color:var(--brand700);font-weight:600}
#view{padding-top:94px;min-height:100vh}

/* ---------- primitives ---------- */
.btn,.btn-primary,.btn-secondary,.btn-ghost,.btn-danger{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--brand600);color:#fff;box-shadow:0 6px 16px -8px rgba(41,71,214,.6)}
.btn-primary:hover{background:var(--brand700)}
.btn-secondary{background:#fff;color:#1e293b;border:1px solid var(--line)}
.btn-secondary:hover{background:#f8fafc;border-color:#cbd5e1}
.btn-ghost{color:#475569;padding:8px 12px}
.btn-ghost:hover{background:#f1f5f9;color:var(--ink)}
.btn-danger{background:#dc2626;color:#fff}
.btn.sm,.btn-primary.sm,.btn-secondary.sm,.btn-ghost.sm,.btn-danger.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.card{border-radius:16px;border:1px solid rgba(226,232,240,.8);background:#fff;box-shadow:var(--soft)}
.card.hover{transition:all .2s}
.card.hover:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.input{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff;padding:10px 14px;font-size:13.5px;outline:none}
.input:focus{border-color:var(--brand400);box-shadow:0 0 0 4px var(--brand50)}
.label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;background:#f1f5f9;color:#475569}
.badge.green{background:#dcfce7;color:#15803d}.badge.blue{background:#e0f2fe;color:#0369a1}.badge.amber{background:#fef3c7;color:#b45309}
.badge.red{background:#fee2e2;color:#b91c1c}.badge.brand{background:var(--brand50);color:var(--brand700)}.badge.dark{background:#0f172a;color:#fff}
.kpi{border-radius:16px;border:1px solid rgba(226,232,240,.8);background:#fff;padding:18px;box-shadow:var(--soft)}
.kpi .l{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.kpi .s{font-size:11.5px;color:#94a3b8;margin-top:2px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--brand100);background:var(--brand50);padding:5px 12px;font-size:12px;font-weight:700;color:var(--brand700)}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.03em}
.muted{color:var(--muted)}
.grad-text{background:linear-gradient(90deg,#2947d6,#6b8bff 50%,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-bg{background:radial-gradient(1200px 600px at 20% -10%,#dfe6ff 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#d1fae5 0,transparent 55%)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:#f8fafc;padding:11px 14px;white-space:nowrap}
table.tbl td{padding:11px 14px;border-top:1px solid #f1f5f9;vertical-align:middle}
table.tbl tr:hover td{background:#f8fafc}
.grid{display:grid;gap:16px}
.mb2{margin-bottom:8px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}.mt2{margin-top:8px}.mt4{margin-top:16px}.mt6{margin-top:24px}
.row{display:flex;align-items:center;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:10px}
.mono{font-family:var(--mono);font-size:12px}
.pill-progress{height:6px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.pill-progress i{display:block;height:100%;border-radius:99px;background:var(--brand600)}
.sep{border-top:1px solid var(--line)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 94px)}
.side{background:#fff;border-right:1px solid rgba(226,232,240,.8);display:flex;flex-direction:column;padding:14px 12px}
.side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;padding:2px 6px 12px}
.side .mark{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--brand500),var(--brand700));display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(41,71,214,.8)}
.side .grp{padding:12px 10px 4px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}
.nav{display:flex;align-items:center;gap:11px;border-radius:12px;padding:8px 11px;font-size:13.5px;font-weight:500;color:#475569;width:100%;text-align:left}
.nav:hover{background:#f1f5f9;color:var(--ink)}
.nav.on{background:var(--brand50);color:var(--brand700);font-weight:600}
.nav svg{width:16px;height:16px;opacity:.7}.nav.on svg{opacity:1}
.plancard{margin-top:auto;border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--brand900),var(--brand700))}
.topbar{position:sticky;top:94px;z-index:20;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(226,232,240,.8);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);padding:10px 20px}
.searchbtn{margin-left:auto;display:flex;align-items:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:#f8fafc;padding:6px 12px;font-size:12px;color:var(--muted);width:250px}
.kbd{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:5px;padding:0 5px;font-size:10px}
.avatar{width:24px;height:24px;border-radius:8px;background:var(--brand100);color:var(--brand700);display:grid;place-items:center;font-weight:800;font-size:11px}
.main{padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:12px;border:1px solid #fde68a;background:#fffbeb;padding:9px 14px;font-size:12px;color:#92400e}

/* ---------- marketing ---------- */
.mhead{position:sticky;top:94px;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid #f1f5f9}
.mhead .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.mnav{display:flex;gap:26px;font-size:13.5px;font-weight:500;color:#475569}
.mwrap{max-width:1100px;margin:0 auto;padding:0 16px}
.mfoot{border-top:1px solid #f1f5f9;background:#f8fafc;margin-top:0}
.mfoot .cols{max-width:1100px;margin:0 auto;padding:52px 16px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:36px;font-size:13px}
.mfoot ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;color:#475569}
.section{padding:76px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

/* ---------- media / swipe ---------- */
.phone{width:300px;aspect-ratio:9/16;border-radius:26px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 60px -30px rgba(11,26,75,.7)}
.g1{background:linear-gradient(135deg,#2947d6,#0b1a4b)}.g2{background:linear-gradient(135deg,#c026d3,#4c1d95)}
.g3{background:linear-gradient(135deg,#10b981,#065f46)}.g4{background:linear-gradient(135deg,#f59e0b,#9a3412)}
.g5{background:linear-gradient(135deg,#0ea5e9,#0c4a6e)}.g6{background:linear-gradient(135deg,#ef4444,#7f1d1d)}
.thumb{aspect-ratio:9/16;border-radius:14px;padding:14px;color:#fff;display:flex;align-items:flex-end;font-weight:800;font-size:15px;line-height:1.15;position:relative;overflow:hidden}
.thumb .tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 8px}
.circle{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cal .h{background:#f8fafc;padding:8px;font-size:11px;font-weight:700;color:var(--muted)}
.cal .d{background:#fff;min-height:104px;padding:6px}
.cal .d .n{font-size:11px;color:#94a3b8}
.ev{border-radius:8px;padding:4px 6px;font-size:10.5px;margin-top:4px;border:1px solid;display:flex;gap:4px;align-items:center}
.ev.pub{background:#f0fdf4;border-color:#bbf7d0}.ev.sch{background:#f0f9ff;border-color:#bae6fd}
.ev.pend{background:#fffbeb;border-color:#fde68a}.ev.fail{background:#fef2f2;border-color:#fecaca}
.bar{display:flex;align-items:flex-end;gap:5px;height:110px}
.bar i{flex:1;background:var(--brand600);border-radius:5px 5px 0 0;display:block}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{display:flex;align-items:center;gap:7px;padding:10px 14px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand700);border-bottom-color:var(--brand600);font-weight:600}
.tabs button svg{width:15px;height:15px}
details{border-top:1px solid #f1f5f9}
details summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details p{padding-bottom:14px;color:var(--muted);font-size:13.5px}
.mapbox{height:300px;border-radius:14px;background:linear-gradient(135deg,#e2e8f0,#cbd5e1);position:relative;overflow:hidden;display:grid;place-items:center}
.mapbox .grid-lines{position:absolute;inset:0;background-image:linear-gradient(#ffffff55 1px,transparent 1px),linear-gradient(90deg,#ffffff55 1px,transparent 1px);background-size:38px 38px}
.mapbox .pin{position:relative;z-index:2;text-align:center}
.mapbox .dot{width:20px;height:20px;border-radius:50%;background:#dc2626;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3);margin:0 auto}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.mfoot .cols{grid-template-columns:1fr 1fr}}
</style>
</head>

  <div class="logo"><span class="mark">

</div>

  for (let i = 0; i < 35; i++) { const n = i - startDow + 1; days.push(n >= 1 && n <= 30 ? n : null); }
  return shell("a-calendar", `
<div class="row" style="justify-content:space-between;flex-wrap:wrap">
  <h1 class="page-title">Calendar</h1>
  <div class="wrap"><button class="btn-ghost">‹</button><b style="min-width:150px;text-align:center">September 2026</b><button class="btn-ghost">›</button>
    <div class="row" style="border:1px solid var(--line);border-radius:12px;overflow:hidden;gap:0">${["month", "week", "list"].map((v, i) => `<button style="padding:6px 14px;font-size:12.5px;${i === 0 ? "background:var(--brand600);color:#fff" : "background:#fff"}">${v}</button>`).join("")}</div>
    <button class="btn-secondary sm" onclick="toast('Downloaded velocity.ics (prototype)')">Export .ics</button><button class="btn-secondary sm" onclick="toast('Feed URL copied (prototype)')">Subscribe</button></div>
</div>
<div class="cal">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="h">${d}</div>`).join("")}
${days.map(n => `<div class="d">${n ? `<div class="n" ${n === 13 ? 'style="font-weight:800;color:var(--brand600)"' : ""}>${n}</div>${DATA.calendar.filter(e => e.d === n).map(e => `<div class="ev ${e.s}" title="${e.hook}" onclick="toast('${e.hook} — ${e.s} (prototype)')"><b>${e.t}</b> ${e.p} <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.hook}</span></div>`).join("")}` : ""}</div>`).join("")}</div>
<div class="wrap"><span class="badge green">published</span><span class="badge blue">scheduled</span><span class="badge amber">pending approval</span><span class="badge red">failed / held</span><span class="muted" style="font-size:12px">Drag any post to reschedule · click to approve, retry or cancel</span></div>`);
};

/* ============ router ============ */
const AREAS = {
  marketing: { label: "Marketing site", pages: [["m-home", "Landing"], ["m-pricing", "Pricing"], ["m-faq", "FAQ"], ["m-blog", "Blog"], ["m-post", "Blog post"], ["m-tool", "Tool page (SEO)"], ["m-compare", "Comparison (SEO)"], ["m-industry", "Industry (SEO)"], ["m-dev", "API & MCP docs"], ["m-aff", "Affiliate program"], ["m-contact", "Contact + map"], ["m-privacy", "Privacy policy"], ["m-404", "404 page"], ["m-login", "Login"]] },
  app: { label: "Product app", pages: [["a-onboarding", "Onboarding"], ["a-velocity", "Velocity mode"], ["a-content", "Content library"], ["a-content-detail", "Content detail"], ["a-studio", "Studio"], ["a-calendar", "Calendar"], ["a-automations", "Automations"], ["a-analytics", "Analytics"], ["a-trends", "Trends"], ["a-characters", "Characters"], ["a-affiliate", "Affiliate"], ["a-set-profile", "Settings · Profile"], ["a-set-socials", "Settings · Socials"], ["a-set-billing", "Settings · Billing"], ["a-set-members", "Settings · Team"], ["a-set-api", "Settings · API"], ["a-set-tracking", "Settings · Tracking"]] },
  admin: { label: "Admin panel", pages: ADMIN_TABS.map(([p, l]) => [p, l]) },
};
const areaOf = (p) => p.startsWith("m-") ? "marketing" : p.startsWith("ad-") ? "admin" : "app";
let current = "m-home";

function go(p) { if (!pages[p]) { p = "m-404"; } current = p; location.hash = p; render(); window.scrollTo(0, 0); }
function render() {
  const area = areaOf(current);
  document.getElementById("areaSeg").innerHTML = Object.entries(AREAS).map(([k, v]) => `<button class="${area === k ? "on" : ""}" onclick="go('${v.pages[0][0]}')">${v.label}</button>`).join("");
  document.getElementById("pagebar").innerHTML = AREAS[area].pages.map(([p, l]) => `<button class="${current === p ? "on" : ""}" onclick="go('${p}')">${l}</button>`).join("");
  document.getElementById("view").innerHTML = pages[current]();
}
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.style.cssText = "position:fixed;bottom:22px;right:22px;z-index:200;display:grid;gap:8px"; document.body.appendChild(t); }
  const el = document.createElement("div");
  el.style.cssText = "background:#0f172a;color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)";
  el.textContent = msg; t.appendChild(el); setTimeout(() => el.remove(), 2600);
}
window.addEventListener("hashchange", () => { const p = location.hash.slice(1); if (p && pages[p] && p !== current) { current = p; render(); } });
document.addEventListener("keydown", (e) => {
  if (current !== "a-velocity") return;
  if (e.key === "ArrowRight" || e.key === "k") appSwipe(1);
  if (e.key === "ArrowLeft" || e.key === "s") appSwipe(0);
});
current = (location.hash.slice(1) && pages[location.hash.slice(1)]) ? location.hash.slice(1) : "m-home";
render();
</script>
</body>
</html>
